          <dt>${esc(L.role)}</dt><dd>${esc(L.roles[R.role] || R.role)}</dd></dl></div>
      <div class="card"><h2>${esc(L.doc)}</h2>
        ${R.pdfUrl ? `<div class="row"><a class="btn primary" href="${esc(R.pdfUrl)}" target="_blank" rel="noopener noreferrer">${esc(L.open)}</a></div>
          ${matchMedia('(min-width: 760px)').matches ? `<iframe class="pdf" src="${esc(R.pdfUrl)}" title="PDF"></iframe>` : ''}` : ''}
        <div class="small muted">${esc(L.size)}</div><div class="hash">${esc(R.docHash)}</div></div>
      ${declining ? `<div class="card"><label class="f">${esc(L.reason)}<textarea id="why" rows="3" maxlength="1000">${esc(why)}</textarea></label>
          ${err ? `<div class="banner bad">${esc(err)}</div>` : ''}
          <div class="row"><button class="btn primary" id="decGo"${busy ? ' disabled' : ''}>${esc(L.declineGo)}</button><button class="btn" id="decNo">${esc(L.cancel)}</button></div></div>`
      : `<div class="card">
        <label class="check"><input type="checkbox" id="acc"${acc ? ' checked' : ''}><span>${esc(R.statement === 'kennisname' ? L.kennisname : L.akkoord)}</span></label>
        <label class="f">${esc(L.name)}<input type="text" id="nm" autocomplete="name" maxlength="120" value="${esc(nameV)}"></label>
        <div class="f" style="display:grid;gap:4px"><span class="small muted" style="font-weight:600">${esc(L.sig)}</span>
          <div class="pad"><canvas id="pad" aria-label="${esc(L.sig)}"></canvas><span class="ln"></span><span class="hint" id="hint">${esc(L.sigHint)}</span></div>
          <div><button class="btn link" id="clr">${esc(L.clear)}</button></div></div>
        ${A.on ? accBox() : `${codeSent ? `<div class="banner ok">${esc(f(L.codeSent, { m: dest, n: 10 }))}</div>
          <label class="f">${esc(sms ? L.codeSms : L.code)}<input class="code" id="cd" inputmode="numeric" autocomplete="one-time-code" maxlength="6" value="${esc(codeV)}"></label>` : ''}
        ${err ? `<div class="banner bad">${esc(err)}</div>` : ''}
        <div class="row">${codeSent ? `<button class="btn primary" id="go"${busy ? ' disabled' : ''}>${esc(L.sign)}</button><button class="btn" id="getCode"${busy ? ' disabled' : ''}>${esc(L.again)}</button>`
          : `<button class="btn primary" id="getCode"${busy ? ' disabled' : ''}>${esc(f(sms ? L.getCodeSms : L.getCode, { m: dest }))}</button>`}</div>
        ${R.account ? `<div class="banner info" style="display:grid;gap:6px"><span class="small">${esc(f(L.accHint, { ch: sms ? L.smsW : L.mailW }))}</span><div><button class="btn" id="accOn">${esc(L.accBtn)}</button></div></div>` : ''}`}
        <button class="btn link" id="dec">${esc(L.decline)}</button>
        <p class="small muted" style="margin:0">${esc(L.legal)}</p></div>`}`;
    if (!declining) {
      const keep = strokes; bindPad(); strokes = keep; paint();
      $('#clr').onclick = () => { strokes = []; paint(); };
      if ($('#getCode')) $('#getCode').onclick = sendCode; if ($('#go')) $('#go').onclick = sign;
      if ($('#accOn')) $('#accOn').onclick = () => { A.on = true; err = ''; render(); if ($('#ae')) $('#ae').focus(); };
      if ($('#accOff')) $('#accOff').onclick = () => { accEnd(); err = ''; render(); };
      if ($('#aLogin')) $('#aLogin').onclick = accLogin; if ($('#aTotp')) $('#aTotp').onclick = accTotp;
      $('#dec').onclick = () => { declining = true; err = ''; render(); };
    } else { $('#decGo').onclick = decline; $('#decNo').onclick = () => { declining = false; err = ''; render(); }; }
  }
  const E = (j) => { const k = 'e_' + (j.error || ''); return L[k] ? f(L[k], { n: j.left }) : j.error === 'expired' ? L.expired : j.error === 'revoked' ? L.revoked : L.net; };
  function check() { if (!$('#acc').checked) return L.e_accept; if ($('#nm').value.trim().length < 2) return L.e_name; if (!strokes.length) return L.e_sig; return ''; }
  async function sendCode() {
    err = check(); if (err) { render(); return; }
    busy = true; render(); let j = {}; try { j = await call({ action: 'code', t: tok }); } catch (e) { j = {}; } busy = false;
    if (j.ok) { codeSent = true; err = ''; } else err = E(j); render(); if ($('#cd')) $('#cd').focus();
  }
  async function sign() {
    const viaAcc = A.on && A.step === 'ok' && A.s;
    err = check(); if (!err && !viaAcc && !/^\d{6}$/.test(($('#cd').value || '').trim())) err = L.e_code.replace(/\s*\(.*\)/, '.'); if (err) { render(); return; }
    const body = Object.assign({ action: 'sign', t: tok, name: $('#nm').value.trim(), sig: png(), accept: true }, viaAcc ? { jwt: A.s.access_token } : { code: $('#cd').value.trim() });
    busy = true; render(); let j = {}; try { j = await call(body); } catch (e) { j = {}; } busy = false;
    if (viaAcc && (j.ok || j.error === 'account_other')) accEnd(); else if (viaAcc && /^account/.test(j.error || '')) { A.step = 'login'; A.s = null; }
    if (j.ok) { let o = {}; try { o = await call({ action: 'open', t: tok }); } catch (e) { }
      if (o.ok) R = o; else Object.assign(R, { status: 'signed', signedAt: j.signedAt, signedName: body.name }); signedView(); return; }
    err = E(j); render();
  }
  async function decline() {
    busy = true; render(); let j = {}; try { j = await call({ action: 'decline', t: tok, reason: $('#why').value }); } catch (e) { j = {}; } busy = false;
    if (j.ok) { msg({ ok: false, text: L.declined }); return; } err = E(j); render();
  }
  /** after signing: the proof (who, as what, when, which document) and the report to download */
  function signedView() {
    $('#hd2').textContent = [R.requesterCompany, R.project].filter(Boolean).join(' · ');
    $('#m').innerHTML = `<div class="card"><div class="banner ok">${esc(f(L.done, { d: dt(R.signedAt) }))}</div>
        ${R.pdfUrl ? `<div class="row"><a class="btn primary" href="${esc(R.pdfUrl)}" target="_blank" rel="noopener noreferrer">${esc(R.signedCopy ? L.dlS : L.dl)}</a></div>${R.signedCopy ? `<p class="small muted" style="margin:0">${esc(L.dlSn)}</p>` : ''}` : ''}</div>
      <div class="card"><h2>${esc(L.proof)}</h2>
        <dl class="kv"><dt>${esc(L.project)}</dt><dd>${esc(R.project)}</dd>
          <dt>${esc(L.you)}</dt><dd>${esc([R.signedName || R.signerName, R.signerCompany].filter(Boolean).join(', '))}</dd>
          <dt>${esc(L.role)}</dt><dd>${esc(L.roles[R.role] || R.role)}</dd>
          <dt>${esc(L.stmt)}</dt><dd>${esc(R.statement === 'kennisname' ? L.kennisname : L.akkoord)}</dd>
          <dt>${esc(L.when)}</dt><dd>${esc(dt(R.signedAt))}</dd>
          ${R.method && L.how[R.method] ? `<dt>${esc(L.howL)}</dt><dd>${esc(L.how[R.method])}</dd>` : ''}
          ${R.ip ? `<dt>${esc(L.ip)}</dt><dd>${esc(R.ip)}</dd>` : ''}
          <dt>${esc(L.from)}</dt><dd>${esc([R.requester, R.requesterCompany].filter(Boolean).join(', ') || '—')}</dd></dl>
        <div class="small muted">${esc(L.size)}</div><div class="hash">${esc(R.docHash)}</div>
        <p class="small muted" style="margin:0">${esc(f(L.keep, { n: R.viewDays || 90 }))}</p></div>`;
  }
  async function start() {
    const nav = (navigator.language || 'nl').slice(0, 2); L = T[nav] || T.nl;
    if (!/^[A-Za-z0-9_-]{30,80}$/.test(tok)) { msg({ text: L.token }); return; }
    let j = {}; try { j = await call({ action: 'open', t: tok }); } catch (e) { msg({ text: L.net }); return; }
    if (!j.ok) { msg({ text: j.error === 'revoked' ? L.revoked : j.error === 'token' ? L.token : L.net }); return; }
    R = j; L = T[R.lang] || L; document.documentElement.lang = R.lang; document.title = L.title + ' · ' + R.project;
    $("#ft").textContent = "Ventilation Setup Tool";
    if (R.status === 'signed') { signedView(); return; }
    if (R.status === 'declined') { msg({ text: L.declined }); return; }
    if (R.expired) { msg({ text: L.expired }); return; }
    render();
    addEventListener('resize', () => { if (cv) paint(); });
  }
  start();
})();
</script>
</body>
</html>
